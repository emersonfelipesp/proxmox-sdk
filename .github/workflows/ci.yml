name: CI

on:
  push:
    branches: [main, testing, "v*"]
  pull_request:
    branches: [main, testing, "v*"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ty type checks
        run: uv run ty check proxmox_sdk tests --output-format concise

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --extra test --group dev

      - name: Compile package
        run: uv run python -m compileall proxmox_sdk tests

      - name: Import smoke checks
        run: |
          uv run python -c "import proxmox_sdk.main"
          uv run python -c "import proxmox_sdk.mock_main"
          uv run python -c "import proxmox_sdk.pdm_mock_main"

  package:
    name: Build and verify wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync runtime dependencies
        run: uv sync --frozen

      - name: Build distribution
        run: uv run --with build python -m build

      - name: Validate package metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Verify installed-wheel PDM contract
        run: uv run python tests/verify_wheel_contract.py dist/*.whl

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proxmox_schema: [latest, "9.2", "9.1.11"]
    env:
      PROXMOX_MOCK_SCHEMA_VERSION: ${{ matrix.proxmox_schema }}
      PROXMOX_MOCK_STATE_NAMESPACE: pmx_${{ matrix.proxmox_schema }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --extra test --group dev

      - name: Run mocked schema-driven tests (schema=${{ matrix.proxmox_schema }})
        run: uv run pytest -n auto --cov=proxmox_sdk --cov-report=term-missing --cov-report=xml tests

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: proxmox-sdk-coverage-${{ matrix.proxmox_schema }}
          path: coverage.xml

  # Publish Docker images:
  # - Dev images on main/testing branch push/PR (dev tag)
  # - Production images on GitHub Release (version tag + latest)
  docker-images:
    name: Publish Docker images (Hub)
    needs: [lint, syntax, package, test]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')) ||
      (github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease)
    uses: ./.github/workflows/docker-hub-publish.yml
    with:
      source_ref: ${{ github.sha }}
      mode: publish
      release: ${{ github.event_name == 'release' }}
    secrets: inherit
