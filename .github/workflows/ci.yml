name: CI

on:
  push:
    branches: [main, testing, "v*"]
  pull_request:
    branches: [main, testing, "v*"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"

      - name: Sync dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev

      - name: Validate GitHub Actions workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          mkdir -p /tmp/actionlint
          curl --fail --show-error --silent --location \
            --output /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" /tmp/actionlint.tar.gz | sha256sum --check --strict -
          tar --no-same-owner -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint -color .github/workflows/*.yml
          /tmp/actionlint/actionlint -color \
            -ignore 'label ".*" is unknown' .gitea/workflows/*.yml

      - name: Run ruff check
        run: uv run --locked ruff check .

      - name: Run ruff format check
        run: uv run --locked ruff format --check .

      - name: Run ty type checks
        run: uv run --locked ty check proxmox_sdk tests --output-format concise

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"

      - name: Sync dependencies
        run: |
          uv lock --check
          uv sync --locked --extra test --group dev

      - name: Compile package
        run: uv run --locked python -m compileall proxmox_sdk tests

      - name: Import smoke checks
        run: |
          uv run --locked python -c "import proxmox_sdk.main"
          uv run --locked python -c "import proxmox_sdk.mock_main"
          uv run --locked python -c "import proxmox_sdk.pdm_mock_main"

  package:
    name: Build and verify wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"

      - name: Sync runtime dependencies
        run: |
          uv lock --check
          uv sync --locked --group dev

      - name: Build distribution
        run: uv run --locked python -m build --no-isolation

      - name: Validate package metadata
        run: uv run --locked python -m twine check dist/*

      - name: Verify installed-wheel PDM contract
        run: uv run --locked python tests/verify_wheel_contract.py dist/*.whl

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        proxmox_schema: [latest, "9.3", "9.2", "9.1.11"]
    env:
      PROXMOX_MOCK_SCHEMA_VERSION: ${{ matrix.proxmox_schema }}
      PROXMOX_MOCK_STATE_NAMESPACE: pmx_${{ matrix.proxmox_schema }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"

      - name: Sync dependencies
        run: |
          uv lock --check
          uv sync --locked --extra test --group dev

      - name: Install locked Chromium on the ephemeral hosted runner
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/proxmox-playwright
        run: |
          set -euo pipefail
          uv run --locked playwright install chromium --with-deps
          test -x "$PLAYWRIGHT_BROWSERS_PATH/chromium_headless_shell-1208/chrome-headless-shell-linux64/chrome-headless-shell"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

      - name: Run mocked schema-driven tests (schema=${{ matrix.proxmox_schema }})
        run: uv run --locked pytest -n 4 --cov=proxmox_sdk --cov-report=term-missing --cov-report=xml tests

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxmox-sdk-coverage-${{ matrix.proxmox_schema }}
          path: coverage.xml

  docs:
    name: Read-only documentation validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"

      - name: Sync documentation dependencies
        run: |
          uv lock --check
          uv sync --locked --extra cli --extra docs

      - name: Docgen pre-check
        run: |
          uv run --locked proxmox docs generate-capture --max-lines 200 --max-chars 120000
          test -f docs/generated/proxmox-command-capture.md
          test -f docs/generated/raw/index.json

      - name: Build docs pre-check
        run: uv run --locked mkdocs build --strict

  # CI is the sole publisher for mutable dev + commit-traceability SHA tags. Stable
  # version/latest tags are published only by the release workflow.
  docker-images:
    name: Publish Docker dev images (Hub)
    needs: [lint, syntax, package, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing') && vars.CI_QUALIFICATION_ONLY != 'true'
    uses: ./.github/workflows/docker-hub-publish.yml
    with:
      source_ref: ${{ github.sha }}
      mode: publish
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  ci-summary:
    name: Complete CI
    if: ${{ always() }}
    needs: [lint, syntax, package, test, docs, docker-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete quality and the expected publication disposition
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SYNTAX_RESULT: ${{ needs.syntax.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCKER_RESULT: ${{ needs.docker-images.result }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          QUALIFICATION_ONLY: ${{ vars.CI_QUALIFICATION_ONLY }}
        run: |
          python3 -I -S - <<'PY'
          import os


          def expected_publication(event: str, ref: str, qualification: str) -> str:
              """Require publication only for eligible ordinary branch pushes."""
              if (
                  event == "push"
                  and ref in {"refs/heads/main", "refs/heads/testing"}
                  and qualification.lower() != "true"
              ):
                  return "success"
              return "skipped"


          def require_results(results: dict[str, str], publication: str) -> None:
              """Refuse missing, failed, cancelled, or unexpectedly skipped jobs."""
              for name in ("lint", "syntax", "package", "test", "docs"):
                  if results[name] != "success":
                      raise SystemExit("Required CI job did not succeed: " + name)
              if results["docker-images"] != publication:
                  raise SystemExit("Docker publication disposition did not match this event")


          require_results(
              {
                  "lint": os.environ.get("LINT_RESULT", ""),
                  "syntax": os.environ.get("SYNTAX_RESULT", ""),
                  "package": os.environ.get("PACKAGE_RESULT", ""),
                  "test": os.environ.get("TEST_RESULT", ""),
                  "docs": os.environ.get("DOCS_RESULT", ""),
                  "docker-images": os.environ.get("DOCKER_RESULT", ""),
              },
              expected_publication(
                  os.environ.get("EVENT_NAME", ""),
                  os.environ.get("EVENT_REF", ""),
                  os.environ.get("QUALIFICATION_ONLY", ""),
              ),
          )
          print("All required quality jobs succeeded; publication disposition is correct.")
          PY
