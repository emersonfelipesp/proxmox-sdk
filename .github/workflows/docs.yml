name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Fetch all history for git info plugin

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"

      - name: Sync documentation dependencies
        run: |
          uv lock --check
          uv sync --locked --extra cli --extra docs

      - name: Docgen pre-check (must pass before deploy)
        run: |
          uv run --locked proxmox docs generate-capture --max-lines 200 --max-chars 120000
          test -f docs/generated/proxmox-command-capture.md
          test -f docs/generated/raw/index.json

      - name: Build docs pre-check
        run: uv run --locked mkdocs build --strict

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        run: uv run --locked mkdocs gh-deploy --force --clean --verbose
