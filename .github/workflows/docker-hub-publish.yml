# Build and smoke images without credentials, stage candidate manifests from
# Docker archives in a protected environment, then promote only by digest.
name: Docker images

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact event commit SHA to build
        type: string
        required: true
      mode:
        description: build-and-test-only, stage (release fan-in), or publish (dev tags)
        type: string
        required: false
        default: publish
    outputs:
      source_sha:
        value: ${{ jobs.resolve-publish-source.outputs.sha }}
      version:
        value: ${{ jobs.resolve-publish-source.outputs.version }}
      raw_digest:
        value: ${{ jobs.stage-images.outputs.raw_digest }}
      nginx_digest:
        value: ${{ jobs.stage-images.outputs.nginx_digest }}
      granian_digest:
        value: ${{ jobs.stage-images.outputs.granian_digest }}
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full 40-character commit SHA to build and test without publishing
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'manual' }}
  cancel-in-progress: false

env:
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  BUILDKIT_IMAGE: docker.io/moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  CANDIDATE_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_REPOSITORY: emersonfelipesp/proxmox-sdk

jobs:
  resolve-publish-source:
    name: resolve immutable source and trusted mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      version: ${{ steps.metadata.outputs.version }}
      release_mode: ${{ steps.context.outputs.release_mode }}
      requested_mode: ${{ steps.context.outputs.requested_mode }}
    steps:
      - name: Validate trusted event and requested mode
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && 'build-and-test-only' || inputs.mode }}
          TRUSTED_RELEASE_MODE: ${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false }}
        run: |
          set -euo pipefail
          case "$REQUESTED_MODE" in
            build-and-test-only|stage|publish) ;;
            *) echo "Unsupported Docker mode: $REQUESTED_MODE" >&2; exit 1 ;;
          esac
          case "$TRUSTED_RELEASE_MODE" in
            true|false) ;;
            *) echo "Unexpected release mode: $TRUSTED_RELEASE_MODE" >&2; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$REQUESTED_MODE" != build-and-test-only ]; then
            echo "Manual Docker runs cannot publish" >&2
            exit 1
          fi
          if [ "$REQUESTED_MODE" = stage ] && [ "$TRUSTED_RELEASE_MODE" != true ]; then
            echo "Only a final release event may stage release images" >&2
            exit 1
          fi
          if [ "$TRUSTED_RELEASE_MODE" = true ] && [ "$REQUESTED_MODE" != stage ]; then
            echo "Final releases must stage images for the outer fan-in promotion" >&2
            exit 1
          fi
          if [ "$REQUESTED_MODE" = publish ]; then
            if [ "$EVENT_NAME" != push ]; then
              echo "Development publication requires a protected branch push" >&2
              exit 1
            fi
            case "$EVENT_REF" in
              refs/heads/main|refs/heads/testing) ;;
              *) echo "Development publication is blocked for $EVENT_REF" >&2; exit 1 ;;
            esac
          fi
          printf 'release_mode=%s\n' "$TRUSTED_RELEASE_MODE" >> "$GITHUB_OUTPUT"
          printf 'requested_mode=%s\n' "$REQUESTED_MODE" >> "$GITHUB_OUTPUT"

      - name: Resolve one exact commit SHA
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SOURCE_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_ref must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ "$SOURCE_REF" != "$EVENT_SHA" ]; then
            echo "Reusable publishers must build the exact triggering event SHA" >&2
            exit 1
          fi
          resolved="$(gh api "repos/${{ github.repository }}/commits/$SOURCE_REF" --jq '.sha')"
          if [ "$resolved" != "$SOURCE_REF" ]; then
            echo "GitHub did not resolve source_ref exactly" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$resolved" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Validate source metadata
        id: metadata
        env:
          RELEASE_MODE: ${{ steps.context.outputs.release_mode }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RESOLVED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RESOLVED_SHA"
          python3 <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if re.fullmatch(r"[0-9][0-9A-Za-z._-]{0,127}", version) is None:
              raise SystemExit(f"Version is not safe as a Docker tag: {version!r}")
          if os.environ["RELEASE_MODE"] == "true":
              expected_tag = f"v{version}"
              if os.environ.get("RELEASE_TAG", "") != expected_tag:
                  raise SystemExit(
                      f"Release tag/version mismatch: expected {expected_tag!r}"
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          printf '%s' "$source_date_epoch" | grep -Eq '^[0-9]{9,12}$'
          printf 'source_date_epoch=%s\n' "$source_date_epoch" >> "$GITHUB_OUTPUT"

  source-quality:
    name: locked source quality gate
    needs: resolve-publish-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-publish-source.outputs.sha }}

      - name: Set up Python 3.13.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Run locked regression and static-analysis gates
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --extra test --group dev
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked ty check proxmox_sdk tests --output-format concise
          uv run --locked python -m compileall proxmox_sdk tests
          uv run --locked python -c "import proxmox_sdk.main, proxmox_sdk.mock_main"
          uv run --locked pytest -n 4 --cov=proxmox_sdk --cov-report=term-missing tests

  build-image:
    name: build + smoke ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: [resolve-publish-source, source-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [raw, nginx, granian]
        arch: [amd64, arm64]
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-publish-source.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker-container
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build locally without registry credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          provenance: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ needs.resolve-publish-source.outputs.source_date_epoch }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-publish-source.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve-publish-source.outputs.version }}
          tags: local/proxmox-sdk:${{ needs.resolve-publish-source.outputs.sha }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Smoke runtime and generate CycloneDX inventory
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.resolve-publish-source.outputs.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          image="local/proxmox-sdk:${SOURCE_SHA}-${VARIANT}-${ARCH}"
          platform="linux/${ARCH}"
          container="proxmox-sdk-${VARIANT}-${ARCH}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --platform "$platform" --name "$container" "$image"
          case "$VARIANT" in
            raw) probe='http://127.0.0.1:8000' ;;
            nginx|granian) probe='https://127.0.0.1:8000' ;;
            *) echo "Unsupported variant: $VARIANT" >&2; exit 1 ;;
          esac
          ready=false
          for attempt in $(seq 1 45); do
            if docker exec "$container" wget --no-verbose --tries=1 --timeout=5 \
              --no-check-certificate --spider "${probe}/health" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" wget --no-verbose --tries=1 --timeout=5 \
            --no-check-certificate --spider "${probe}/version"
          python3 tests/generate_container_sbom.py \
            --image "$image" \
            --platform "$platform" \
            --output "/tmp/${VARIANT}-${ARCH}.cdx.json"
          docker save --output "/tmp/${VARIANT}-${ARCH}.tar" "$image"

      - name: Upload tested image archive and SBOM
        if: needs.resolve-publish-source.outputs.requested_mode != 'build-and-test-only'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ needs.resolve-publish-source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            /tmp/${{ matrix.variant }}-${{ matrix.arch }}.tar
            /tmp/${{ matrix.variant }}-${{ matrix.arch }}.cdx.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  stage-images:
    name: stage tested candidate manifests
    if: needs.resolve-publish-source.outputs.requested_mode != 'build-and-test-only'
    needs: [resolve-publish-source, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dockerhub-candidate
    outputs:
      raw_digest: ${{ steps.stage.outputs.raw_digest }}
      nginx_digest: ${{ steps.stage.outputs.nginx_digest }}
      granian_digest: ${{ steps.stage.outputs.granian_digest }}
    steps:
      - name: Download tested image archives only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-image-${{ needs.resolve-publish-source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: /tmp/docker-images
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Docker Hub candidate environment
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push architecture candidates and assemble manifests
        id: stage
        env:
          SOURCE_SHA: ${{ needs.resolve-publish-source.outputs.sha }}
          VERSION: ${{ needs.resolve-publish-source.outputs.version }}
        run: |
          set -euo pipefail
          : > /tmp/docker-candidate-components.jsonl
          for variant in raw nginx granian; do
            sources=()
            for arch in amd64 arm64; do
              archive="/tmp/docker-images/${variant}-${arch}.tar"
              sbom="/tmp/docker-images/${variant}-${arch}.cdx.json"
              test -f "$archive"
              test -f "$sbom"
              docker load --input "$archive"
              local_image="local/proxmox-sdk:${SOURCE_SHA}-${variant}-${arch}"
              image_id="$(docker image inspect --format '{{.Id}}' "$local_image")"
              image_arch="$(docker image inspect --format '{{.Architecture}}' "$local_image")"
              image_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_image")"
              image_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$local_image")"
              test "$image_arch" = "$arch"
              test "$image_revision" = "$SOURCE_SHA"
              test "$image_version" = "$VERSION"
              jq -e --arg image_id "$image_id" --arg platform "linux/${arch}" \
                --arg revision "$SOURCE_SHA" --arg version "$VERSION" '
                .metadata.component["bom-ref"] == $image_id and
                any(.metadata.component.properties[];
                  .name == "oci.image.platform" and .value == $platform) and
                any(.metadata.component.properties[];
                  .name == "oci.image.label.org.opencontainers.image.revision" and
                  .value == $revision) and
                any(.metadata.component.properties[];
                  .name == "oci.image.label.org.opencontainers.image.version" and
                  .value == $version)
              ' "$sbom" >/dev/null
              archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
              sbom_sha256="$(sha256sum "$sbom" | cut -d ' ' -f 1)"
              printf '%s' "$archive_sha256" | grep -Eq '^[0-9a-f]{64}$'
              printf '%s' "$sbom_sha256" | grep -Eq '^[0-9a-f]{64}$'
              arch_tag="${IMAGE_REPOSITORY}:candidate-${SOURCE_SHA}-${CANDIDATE_RUN_TOKEN}-${variant}-${arch}"
              docker tag "$local_image" "$arch_tag"
              docker push "$arch_tag"
              pushed_digest="$(docker image inspect --format '{{json .RepoDigests}}' "$arch_tag" \
                | jq -er '[.[] | split("@")[1] | select(test("^sha256:[0-9a-f]{64}$"))] | unique | if length == 1 then .[0] else error("expected one pushed digest") end')"
              arch_digest="$(docker buildx imagetools inspect "$arch_tag" \
                --format '{{json .Manifest}}' | jq -er '.digest')"
              printf '%s' "$arch_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
              test "$arch_digest" = "$pushed_digest"
              jq -nc \
                --arg arch "$arch" \
                --arg archive_sha256 "$archive_sha256" \
                --arg image_id "$image_id" \
                --arg registry_manifest_digest "$arch_digest" \
                --arg sbom_sha256 "$sbom_sha256" \
                --arg variant "$variant" \
                '{arch: $arch, archive_sha256: $archive_sha256, image_id: $image_id, registry_manifest_digest: $registry_manifest_digest, sbom_sha256: $sbom_sha256, variant: $variant}' \
                >> /tmp/docker-candidate-components.jsonl
              sources+=("${arch_tag}@${arch_digest}")
            done
            candidate_tag="${IMAGE_REPOSITORY}:candidate-${SOURCE_SHA}-${CANDIDATE_RUN_TOKEN}-${variant}"
            docker buildx imagetools create --tag "$candidate_tag" "${sources[@]}"
            manifest="$(docker buildx imagetools inspect "$candidate_tag" \
              --format '{{json .Manifest}}')"
            printf '%s' "$manifest" | jq -e '
              [.manifests[].platform | {os, architecture}]
              | sort_by(.architecture)
              == [{os: "linux", architecture: "amd64"}, {os: "linux", architecture: "arm64"}]
            ' >/dev/null
            candidate_digest="$(printf '%s' "$manifest" | jq -er '.digest')"
            printf '%s' "$candidate_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf '%s_digest=%s\n' "$variant" "$candidate_digest" >> "$GITHUB_OUTPUT"
          done

      - name: Record staged manifest and SBOM bindings
        env:
          GRANIAN_DIGEST: ${{ steps.stage.outputs.granian_digest }}
          NGINX_DIGEST: ${{ steps.stage.outputs.nginx_digest }}
          RAW_DIGEST: ${{ steps.stage.outputs.raw_digest }}
          SOURCE_SHA: ${{ needs.resolve-publish-source.outputs.sha }}
          VERSION: ${{ needs.resolve-publish-source.outputs.version }}
        run: |
          jq -s \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            --arg raw "$RAW_DIGEST" \
            --arg nginx "$NGINX_DIGEST" \
            --arg granian "$GRANIAN_DIGEST" \
            '{run_attempt: $run_attempt, run_id: $run_id, source_sha: $source_sha, version: $version, manifests: {raw: $raw, nginx: $nginx, granian: $granian}, components: .}' \
            /tmp/docker-candidate-components.jsonl \
            > /tmp/docker-candidate-evidence.json

      - name: Upload candidate manifest and SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-candidate-evidence-${{ needs.resolve-publish-source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/docker-candidate-evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  smoke-candidates:
    name: smoke staged ${{ matrix.variant }} / ${{ matrix.arch }}
    if: needs.resolve-publish-source.outputs.requested_mode != 'build-and-test-only'
    needs: [resolve-publish-source, stage-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [raw, nginx, granian]
        arch: [amd64, arm64]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Pull by digest and smoke runtime
        env:
          ARCH: ${{ matrix.arch }}
          GRANIAN_DIGEST: ${{ needs.stage-images.outputs.granian_digest }}
          NGINX_DIGEST: ${{ needs.stage-images.outputs.nginx_digest }}
          RAW_DIGEST: ${{ needs.stage-images.outputs.raw_digest }}
          SOURCE_SHA: ${{ needs.resolve-publish-source.outputs.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            raw) digest="$RAW_DIGEST"; probe='http://127.0.0.1:8000' ;;
            nginx) digest="$NGINX_DIGEST"; probe='https://127.0.0.1:8000' ;;
            granian) digest="$GRANIAN_DIGEST"; probe='https://127.0.0.1:8000' ;;
            *) echo "Unsupported variant: $VARIANT" >&2; exit 1 ;;
          esac
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          image="${IMAGE_REPOSITORY}:candidate-${SOURCE_SHA}-${CANDIDATE_RUN_TOKEN}-${VARIANT}@${digest}"
          platform="linux/${ARCH}"
          container="candidate-${VARIANT}-${ARCH}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker pull --platform "$platform" "$image"
          docker run -d --platform "$platform" --name "$container" "$image"
          for attempt in $(seq 1 45); do
            if docker exec "$container" wget --no-verbose --tries=1 --timeout=5 \
              --no-check-certificate --spider "${probe}/health" >/dev/null 2>&1; then
              docker exec "$container" wget --no-verbose --tries=1 --timeout=5 \
                --no-check-certificate --spider "${probe}/version"
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1

  promote-development:
    name: promote tested development manifests
    if: needs.resolve-publish-source.outputs.requested_mode == 'publish'
    needs: [resolve-publish-source, stage-images, smoke-candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dockerhub-development
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Docker Hub development environment
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote all development aliases from candidate digests
        env:
          GRANIAN_DIGEST: ${{ needs.stage-images.outputs.granian_digest }}
          NGINX_DIGEST: ${{ needs.stage-images.outputs.nginx_digest }}
          RAW_DIGEST: ${{ needs.stage-images.outputs.raw_digest }}
          SOURCE_SHA: ${{ needs.resolve-publish-source.outputs.sha }}
        run: |
          set -euo pipefail
          for variant in raw nginx granian; do
            case "$variant" in
              raw) digest="$RAW_DIGEST"; suffix='' ;;
              nginx) digest="$NGINX_DIGEST"; suffix='-nginx' ;;
              granian) digest="$GRANIAN_DIGEST"; suffix='-granian' ;;
            esac
            candidate="${IMAGE_REPOSITORY}:candidate-${SOURCE_SHA}-${CANDIDATE_RUN_TOKEN}-${variant}@${digest}"
            dev_tag="${IMAGE_REPOSITORY}:dev${suffix}"
            trace_tag="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}${suffix}"
            docker buildx imagetools create --tag "$dev_tag" --tag "$trace_tag" "$candidate"
            for alias in "$dev_tag" "$trace_tag"; do
              alias_digest="$(docker buildx imagetools inspect "$alias" \
                --format '{{json .Manifest}}' | jq -er '.digest')"
              test "$alias_digest" = "$digest"
            done
          done
