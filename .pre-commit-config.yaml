exclude: ^site/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
        exclude: ^docs/reference/command-capture/
      - id: trailing-whitespace
        exclude: ^docs/reference/command-capture/
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        entry: uv run ty check proxmox_sdk tests --output-format concise
        language: system
        pass_filenames: false
      - id: pyright-check
        name: pyright-check
        entry: uv run pyright proxmox_sdk
        language: system
        pass_filenames: false
