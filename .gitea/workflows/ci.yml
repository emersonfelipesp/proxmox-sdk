name: Gitea CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitea-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static analysis and workflow policy
    runs-on: ci-untrusted-python312
    timeout-minutes: 20
    steps:
      - name: Checkout exact event source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.ref }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == refs/* ]]
          git check-ref-format "$SOURCE_REF"
          cd "${GITHUB_WORKSPACE:?}"
          test ! -e .git
          git init .
          git remote add origin https://git.nmulti.cloud/emersonfelipesp/proxmox-sdk.git
          git -c credential.helper= -c http.extraHeader= fetch \
            --no-tags --no-recurse-submodules origin "$SOURCE_REF"
          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Acquire the pinned setup-uv action privately
        env:
          SETUP_UV_SHA: 11f9893b081a58869d3b5fccaea48c9e9e46f990
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?}"
          action_dir=.tmp/setup-uv
          test ! -e "$action_dir"
          mkdir -p "$action_dir"
          git -C "$action_dir" init .
          git -C "$action_dir" remote add origin https://github.com/astral-sh/setup-uv.git
          git -C "$action_dir" -c credential.helper= -c http.extraHeader= fetch \
            --depth=1 --no-tags --no-recurse-submodules origin "$SETUP_UV_SHA"
          test "$(git -C "$action_dir" rev-parse --verify "FETCH_HEAD^{commit}")" = "$SETUP_UV_SHA"
          git -C "$action_dir" checkout --detach "$SETUP_UV_SHA"

      - name: Set up locked Python tooling
        uses: ./.tmp/setup-uv
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"
          no-project: false

      - name: Sync locked development dependencies
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --group dev

      - name: Validate GitHub and Gitea workflow syntax
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          mkdir -p /tmp/actionlint
          curl --fail --show-error --silent --location \
            --output /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" /tmp/actionlint.tar.gz \
            | sha256sum --check --strict -
          tar --no-same-owner -xzf /tmp/actionlint.tar.gz \
            -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint -color .github/workflows/*.yml
          /tmp/actionlint/actionlint -color \
            -ignore 'label ".*" is unknown' .gitea/workflows/*.yml

      - name: Run Ruff lint
        run: uv run --locked ruff check .

      - name: Run Ruff formatting gate
        run: uv run --locked ruff format --check .

      - name: Run ty type checks
        run: uv run --locked ty check proxmox_sdk tests --output-format concise

      - name: Run Pyright package checks
        run: uv run --locked pyright proxmox_sdk

  syntax:
    name: Syntax and import contracts
    runs-on: ci-untrusted-python312
    timeout-minutes: 20
    steps:
      - name: Checkout exact event source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.ref }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == refs/* ]]
          git check-ref-format "$SOURCE_REF"
          cd "${GITHUB_WORKSPACE:?}"
          test ! -e .git
          git init .
          git remote add origin https://git.nmulti.cloud/emersonfelipesp/proxmox-sdk.git
          git -c credential.helper= -c http.extraHeader= fetch \
            --no-tags --no-recurse-submodules origin "$SOURCE_REF"
          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Acquire the pinned setup-uv action privately
        env:
          SETUP_UV_SHA: 11f9893b081a58869d3b5fccaea48c9e9e46f990
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?}"
          action_dir=.tmp/setup-uv
          test ! -e "$action_dir"
          mkdir -p "$action_dir"
          git -C "$action_dir" init .
          git -C "$action_dir" remote add origin https://github.com/astral-sh/setup-uv.git
          git -C "$action_dir" -c credential.helper= -c http.extraHeader= fetch \
            --depth=1 --no-tags --no-recurse-submodules origin "$SETUP_UV_SHA"
          test "$(git -C "$action_dir" rev-parse --verify "FETCH_HEAD^{commit}")" = "$SETUP_UV_SHA"
          git -C "$action_dir" checkout --detach "$SETUP_UV_SHA"

      - name: Set up locked Python tooling
        uses: ./.tmp/setup-uv
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"
          no-project: false

      - name: Sync locked test dependencies
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --extra test --group dev

      - name: Compile package and tests
        run: uv run --locked python -m compileall proxmox_sdk tests

      - name: Run public import smoke checks
        run: |
          set -euo pipefail
          uv run --locked python -c "import proxmox_sdk.main"
          uv run --locked python -c "import proxmox_sdk.mock_main"
          uv run --locked python -c "import proxmox_sdk.pdm_mock_main"
          uv run --locked python -c "from proxmox_sdk.sdk import ProxmoxSDK"
          uv run --locked python -c "from proxmox_sdk.sdk.sync import SyncProxmoxSDK"
          uv run --locked python -c "from proxmox_sdk.proxmox_cli.cli import cli"

  schema-tests:
    name: Schema regression (${{ matrix.proxmox_schema }})
    runs-on: ci-untrusted-python312
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        proxmox_schema: [latest, "9.3", "9.2", "9.1.11"]
    env:
      PROXMOX_MOCK_SCHEMA_VERSION: ${{ matrix.proxmox_schema }}
      PROXMOX_MOCK_STATE_NAMESPACE: gitea_${{ matrix.proxmox_schema }}_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: Checkout exact event source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.ref }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == refs/* ]]
          git check-ref-format "$SOURCE_REF"
          cd "${GITHUB_WORKSPACE:?}"
          test ! -e .git
          git init .
          git remote add origin https://git.nmulti.cloud/emersonfelipesp/proxmox-sdk.git
          git -c credential.helper= -c http.extraHeader= fetch \
            --no-tags --no-recurse-submodules origin "$SOURCE_REF"
          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Acquire the pinned setup-uv action privately
        env:
          SETUP_UV_SHA: 11f9893b081a58869d3b5fccaea48c9e9e46f990
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?}"
          action_dir=.tmp/setup-uv
          test ! -e "$action_dir"
          mkdir -p "$action_dir"
          git -C "$action_dir" init .
          git -C "$action_dir" remote add origin https://github.com/astral-sh/setup-uv.git
          git -C "$action_dir" -c credential.helper= -c http.extraHeader= fetch \
            --depth=1 --no-tags --no-recurse-submodules origin "$SETUP_UV_SHA"
          test "$(git -C "$action_dir" rev-parse --verify "FETCH_HEAD^{commit}")" = "$SETUP_UV_SHA"
          git -C "$action_dir" checkout --detach "$SETUP_UV_SHA"

      - name: Set up locked Python tooling
        uses: ./.tmp/setup-uv
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"
          no-project: false

      - name: Sync locked test dependencies
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --extra test --group dev

      - name: Prepare job-private Chromium and authenticated Debian libraries
        run: |
          set -euo pipefail
          runtime="$(mktemp -d "${RUNNER_TEMP:?}/proxmox-chromium.XXXXXX")"
          uv run --locked python tools/prepare_ci_chromium.py "$runtime/runtime"
          export LD_LIBRARY_PATH="$runtime/runtime/prefix/usr/lib/x86_64-linux-gnu:$runtime/runtime/prefix/lib/x86_64-linux-gnu"
          export PLAYWRIGHT_BROWSERS_PATH="$runtime/browsers"
          uv run --locked playwright install chromium
          test -x "$PLAYWRIGHT_BROWSERS_PATH/chromium_headless_shell-1208/chrome-headless-shell-linux64/chrome-headless-shell"
          printf 'LD_LIBRARY_PATH=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\nPROXMOX_CHROMIUM_RUNTIME=%s\n' \
            "$LD_LIBRARY_PATH" "$PLAYWRIGHT_BROWSERS_PATH" "$runtime/runtime" >> "$GITHUB_ENV"

      - name: Run complete schema-driven regression suite
        env:
          FONTCONFIG_FILE: ${{ env.PROXMOX_CHROMIUM_RUNTIME }}/fontconfig/fonts.conf
          FONTCONFIG_PATH: ${{ env.PROXMOX_CHROMIUM_RUNTIME }}/fontconfig
        run: >-
          uv run --locked pytest -n 4 --cov=proxmox_sdk --cov-branch
          --cov-report=term-missing --cov-report=xml tests

      - name: Retain schema coverage evidence
        # The deployed Gitea service does not support the artifact protocol used by v4+.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: gitea-proxmox-sdk-coverage-${{ matrix.proxmox_schema }}
          path: |
            coverage.xml
            ${{ env.PROXMOX_CHROMIUM_RUNTIME }}/archive-inventory.json
          if-no-files-found: error
          retention-days: 30

  docs-package:
    name: Strict docs and installed-wheel contract
    runs-on: ci-untrusted-python312
    timeout-minutes: 30
    steps:
      - name: Checkout exact event source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.ref }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == refs/* ]]
          git check-ref-format "$SOURCE_REF"
          cd "${GITHUB_WORKSPACE:?}"
          test ! -e .git
          git init .
          git remote add origin https://git.nmulti.cloud/emersonfelipesp/proxmox-sdk.git
          git -c credential.helper= -c http.extraHeader= fetch \
            --no-tags --no-recurse-submodules origin "$SOURCE_REF"
          test "$(git rev-parse --verify "FETCH_HEAD^{commit}")" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Acquire the pinned setup-uv action privately
        env:
          SETUP_UV_SHA: 11f9893b081a58869d3b5fccaea48c9e9e46f990
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /bin/false
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?}"
          action_dir=.tmp/setup-uv
          test ! -e "$action_dir"
          mkdir -p "$action_dir"
          git -C "$action_dir" init .
          git -C "$action_dir" remote add origin https://github.com/astral-sh/setup-uv.git
          git -C "$action_dir" -c credential.helper= -c http.extraHeader= fetch \
            --depth=1 --no-tags --no-recurse-submodules origin "$SETUP_UV_SHA"
          test "$(git -C "$action_dir" rev-parse --verify "FETCH_HEAD^{commit}")" = "$SETUP_UV_SHA"
          git -C "$action_dir" checkout --detach "$SETUP_UV_SHA"

      - name: Set up locked Python tooling
        uses: ./.tmp/setup-uv
        with:
          version: "0.11.28"
          enable-cache: true
          python-version: "3.12.13"
          no-project: false

      - name: Sync locked docs and build dependencies
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --extra docs --group dev

      - name: Build documentation strictly
        run: uv run --locked mkdocs build --strict

      - name: Build wheel and source distribution
        run: uv run --locked python -m build --no-isolation

      - name: Validate package metadata
        run: uv run --locked python -m twine check dist/*

      - name: Verify installed-wheel schemas and PDM contract
        run: uv run --locked python tests/verify_wheel_contract.py dist/*.whl
