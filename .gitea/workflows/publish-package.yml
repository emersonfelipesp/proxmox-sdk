name: Build Gitea package candidate

on:
  push:
    tags: ["v*"]

# This workflow is an untrusted producer. It must never receive package,
# deployment, or repository-write credentials; publication is performed by the
# separately installed host publisher after independent provenance checks.
permissions:
  contents: read
  packages: none

concurrency:
  group: gitea-package-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-package:
    name: build and attest package candidate
    runs-on: ci-untrusted-python312
    timeout-minutes: 60
    steps:
      - name: Checkout exact tag source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up uv and Python 3.13.14
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          python-version: "3.13.14"
          enable-cache: true

      - name: Sync locked release tools
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --extra test --group dev

      - name: Validate tag and package metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EVENT_SHA" refs/remotes/origin/main
          uv run --locked python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          from packaging.version import InvalidVersion, Version

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          package_name = data["project"]["name"]
          version_text = data["project"]["version"]
          if package_name != "proxmox-sdk":
              raise SystemExit(f"Unexpected package name: {package_name!r}")
          try:
              parsed_version = Version(version_text)
          except InvalidVersion as exc:
              raise SystemExit(f"Invalid PEP 440 version: {version_text!r}") from exc
          if str(parsed_version) != version_text:
              raise SystemExit(f"Version must use canonical PEP 440 spelling: {parsed_version}")
          if parsed_version.local is not None or parsed_version.dev is not None:
              raise SystemExit("Release versions cannot contain local or development segments")
          if parsed_version.pre is not None and parsed_version.pre[0] != "rc":
              raise SystemExit("Prerelease publication is restricted to rc versions")
          if re.fullmatch(r"[0-9][0-9A-Za-z._-]{0,127}", version_text) is None:
              raise SystemExit(f"Unsafe package version: {version_text!r}")
          if os.environ["EVENT_NAME"] != "push":
              raise SystemExit("Package candidates must come from a tag push")
          if os.environ["EVENT_REF"] != f"refs/tags/v{version_text}":
              raise SystemExit("Tag does not match pyproject version")
          if os.environ["RELEASE_REPOSITORY"] != "emersonfelipesp/proxmox-sdk":
              raise SystemExit("Unexpected repository identity")
          if os.environ["RELEASE_SERVER_URL"] != "https://git.nmulti.cloud":
              raise SystemExit("Unexpected Gitea server identity")
          run_id = os.environ["RELEASE_RUN_ID"]
          run_attempt = os.environ["RELEASE_RUN_ATTEMPT"]
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None:
              raise SystemExit("Release run ID is invalid")
          if re.fullmatch(r"[1-9][0-9]*", run_attempt) is None:
              raise SystemExit("Release run attempt is invalid")
          epoch = int(
              subprocess.check_output(
                  ["git", "show", "-s", "--format=%ct", "HEAD"], text=True
              ).strip()
          )
          artifact_name = f"gitea-dist-{os.environ['EVENT_SHA']}-{run_id}-{run_attempt}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_name={artifact_name}\n")
              output.write(f"source_date_epoch={epoch}\n")
              output.write(f"version={version_text}\n")
          PY

      - name: Run static analysis and complete regression suite
        run: |
          set -euo pipefail
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked ty check proxmox_sdk tests --output-format concise
          uv run --locked python -m compileall proxmox_sdk tests tools
          uv run --locked pytest -n 4 --cov=proxmox_sdk \
            --cov-report=term-missing --cov-report=xml tests

      - name: Build twice and require byte-for-byte reproducibility
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          uv run --locked python tests/build_reproducible_distributions.py \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-dir dist \
            --manifest release-artifacts/distribution-manifest.json
          uv run --locked python -m twine check dist/*
          uv run --locked python tests/verify_wheel_contract.py dist/*.whl

      - name: Bind attestation to the workflow run and candidate bytes
        env:
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_SERVER_URL: ${{ github.server_url }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.source_date_epoch }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tarfile

          def sha256(path: pathlib.Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest_path = pathlib.Path("release-artifacts/distribution-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest.update(
              source_sha=os.environ["EVENT_SHA"],
              version=os.environ["VERSION"],
          )
          # Keep this cross-system manifest byte-compatible with the GitHub
          # release gate. Gitea-only provenance is a separate document.
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          distribution_manifest_sha256 = sha256(manifest_path)

          provenance_path = pathlib.Path("release-artifacts/gitea-provenance.json")
          provenance = dict(
              schema_version=1,
              artifact_name=os.environ["ARTIFACT_NAME"],
              distribution_manifest_sha256=distribution_manifest_sha256,
              event="push",
              ref=os.environ["EVENT_REF"],
              repository=os.environ["RELEASE_REPOSITORY"],
              run_attempt=int(os.environ["RELEASE_RUN_ATTEMPT"]),
              run_id=int(os.environ["RELEASE_RUN_ID"]),
              server_url=os.environ["RELEASE_SERVER_URL"],
              source_sha=os.environ["EVENT_SHA"],
              tag=os.environ["EVENT_REF"].removeprefix("refs/tags/"),
              version=os.environ["VERSION"],
              workflow_name="Build Gitea package candidate",
              workflow_path=".gitea/workflows/publish-package.yml",
              workflow_sha256=sha256(pathlib.Path(".gitea/workflows/publish-package.yml")),
          )
          provenance_path.write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          artifacts = manifest["artifacts"]
          checksum_path = pathlib.Path("release-artifacts/SHA256SUMS")
          checksum_path.write_text(
              "".join(f"{digest}  dist/{name}\n" for name, digest in sorted(artifacts.items())),
              encoding="ascii",
          )

          members = [
              *(pathlib.Path("dist") / name for name in sorted(artifacts)),
              manifest_path,
              provenance_path,
              checksum_path,
          ]
          payload = pathlib.Path("release-artifacts/proxmox-sdk-gitea-candidate.tar")
          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          with tarfile.open(payload, "w", format=tarfile.PAX_FORMAT) as archive:
              for path in members:
                  info = archive.gettarinfo(str(path), arcname=path.as_posix())
                  info.uid = 0
                  info.gid = 0
                  info.uname = "root"
                  info.gname = "root"
                  info.mode = 0o644
                  info.mtime = epoch
                  with path.open("rb") as handle:
                      archive.addfile(info, handle)

          digest = sha256(payload)
          print(f"PROXMOX_SDK_ARTIFACT_NAME={os.environ['ARTIFACT_NAME']}")
          print(f"PROXMOX_SDK_CANDIDATE_SHA256={digest}")
          PY

      - name: Upload attested package candidate
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2; deployed Gitea-compatible artifact protocol
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release-artifacts/proxmox-sdk-gitea-candidate.tar
          if-no-files-found: error
          retention-days: 90
